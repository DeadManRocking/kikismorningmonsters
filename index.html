  <title>Morning Monster</title>
  <style>
    :root {
      --bg-top: #F3EFE9;
      --bg-bottom: #EADDCF;
      --surface: rgba(234, 221, 207, 0.85);
      --primary: #694E4E;
      --secondary: #A67B5B;
      --text-main: #332F2C;
      --text-muted: rgba(51, 47, 44, 0.60);
      --text-subtle: rgba(51, 47, 44, 0.50);
      --card-border: rgba(105, 78, 78, 0.15);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-top: #1E1C1A;
        --bg-bottom: #2A2724;
        --surface: rgba(42, 39, 36, 0.85);
        --primary: #C7B198;
        --secondary: #A67B5B;
        --text-main: #EADDCF;
        --text-muted: rgba(234, 221, 207, 0.60);
        --text-subtle: rgba(234, 221, 207, 0.50);
        --card-border: rgba(199, 177, 152, 0.15);
      }
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }

    .page-wrapper {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      padding: calc(18px + env(safe-area-inset-top, 0px)) 20px calc(28px + env(safe-area-inset-bottom, 0px)) 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      text-align: center;
      padding: 6px 4px;
      margin-bottom: 8px;
    }

    .date-display {
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .app-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-main);
      margin: 0;
      letter-spacing: -0.3px;
    }

    .identity-block {
      text-align: center;
      margin-bottom: 14px;
    }

    .monster-name {
      font-family: Georgia, "Times New Roman", Times, serif;
      font-style: italic;
      font-size: 21px;
      font-weight: 600;
      color: var(--primary);
      margin: 0 0 4px 0;
    }

    .species-title {
      font-size: 10px;
      letter-spacing: 1.8px;
      font-weight: 500;
      color: var(--text-subtle);
      text-transform: uppercase;
      margin: 0;
    }

    .portrait-stage {
      position: relative;
      width: 100%;
      padding: 8px 14px;
      aspect-ratio: 3 / 4;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .breathing-aura {
      position: absolute;
      width: 93%;
      height: 94%;
      border-radius: 32px;
      pointer-events: none;
      will-change: transform;
    }

    .monster-card {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.18);
      border: 1px solid rgba(122, 139, 110, 0.35);
      cursor: pointer;
      will-change: transform;
      background: #2A2724;
      touch-action: pan-y;
    }

    .monster-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .vignette-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 65%, rgba(0,0,0,0.20) 100%);
      pointer-events: none;
    }

    .morning-message {
      margin-top: 22px;
      padding: 4px 8px;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 20px;
      line-height: 30px;
      font-weight: 400;
      color: var(--text-main);
      text-align: center;
      cursor: pointer;
    }

    .trivia-card {
      margin-top: 22px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 18px 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      text-align: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .trivia-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--secondary);
      font-size: 11px;
      letter-spacing: 1.2px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .trivia-header svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .trivia-body {
      font-family: Georgia, "Times New Roman", Times, serif;
      font-style: italic;
      font-size: 15px;
      line-height: 22px;
      color: var(--text-main);
      opacity: 0.92;
      margin: 0;
    }
  </style>
</head>

    const COMBINATIONS = [
      { monsterId: 0, monsterName: "The Dew-Pupil Pip", message: "Good morning, my sweet anomaly. The shadows curled at the edge of your bed all night just to watch you breathe.", trivia: "Petrichor, the earthy smell of fresh rain, is caused by geosmin, an organic compound human noses can detect at 5 parts per trillion—far more acute than sharks detecting blood." },
      { monsterId: 1, monsterName: "The Spindle-Marrow Sprout", message: "Awaken, my lovely wonder. I collected six drops of mist for you, but they dissolved when I thought of your smile.", trivia: "A typical cumulus cloud weighs around 500,000 kilograms (1.1 million pounds)—roughly equal to 100 fully grown elephants floating silently overhead." },
      { monsterId: 2, monsterName: "The Soot-Whiskered Slumberling", message: "Good morning. The cold air outside has no teeth until you step into it; until then, I will hoard the fireplace warmth beside you.", trivia: "Falling raindrops are not tear-shaped; as air resistance pushes upward on their base, they flatten out into miniature hamburger buns." },
      { monsterId: 3, monsterName: "The Kettle-Eyed Chimera", message: "Open your dark eyes. The world outside is terrifyingly mundane until your shadow steps into the morning light.", trivia: "A single lightning bolt heats the surrounding air channel to approximately 53,540°F—more than five times hotter than the visible surface of the sun." },
      { monsterId: 4, monsterName: "The Moss-Brimmed Lurker", message: "Rise softly, darling. I counted the dust motes dancing in your morning sunbeam; not one of them was brave enough to touch your brow.", trivia: "Fata Morgana mirages can bend light rays over the horizon, making distant ships appear to float upside down suspended in the empty morning sky." },
      { monsterId: 5, monsterName: "The Steaming Pipkin", message: "I boiled away three small nightmares in your tea water this morning. Drink deeply; only quiet thoughts remain.", trivia: "The smell of pre-rain ozone is produced when electrical charges from split nitrogen and oxygen molecules recombine into O3." },
      { monsterId: 6, monsterName: "The Leaf-Swaddled Reverie", message: "I wrapped myself in the reddest maple leaf I could find so you would notice me before the sunrise distracts you.", trivia: "Morning dew does not fall from the sky; it condenses directly onto surfaces from water vapor already hovering in the ground air layer." },
      { monsterId: 7, monsterName: "The Mushroom-Crown Imp", message: "Good morning. Spores have no memories, but I seem to remember you from a hundred autumns before this one.", trivia: "A cubic mile of ordinary fog contains less than a gallon of liquid water dispersed into billions of microscopic droplets." },
      { monsterId: 8, monsterName: "The Floaty Dough-Sprite", message: "I drifted into your kitchen because you sighed in your sleep. If you leave a window open, I will stay until breakfast.", trivia: "Cirrus clouds are composed entirely of ice crystals and can streak across the upper troposphere at speeds exceeding 100 miles per hour." },
      { monsterId: 9, monsterName: "The Dandelion-Umbrella Beast", message: "The morning breeze tried to sweep me across the valley, but I dug my tiny claws into your rug because you are here.", trivia: "A single mature thunderstorm can hold over 275 million gallons of water suspended against gravity by powerful updrafts." },
      { monsterId: 10, monsterName: "The Owl-Faced Twigling", message: "I blinked seven hundred times while you slept, keeping watch over the windowpane so no bad omens dared look in.", trivia: "The world's highest wind speed recorded not related to tornadoes was 253 mph on Barrow Island, Australia, during Cyclone Olivia." },
      { monsterId: 11, monsterName: "The Meadow-Jelly Drifter", message: "Good morning, my fragile miracle. The grass is shivering outside, waiting for the soles of your feet to warm it.", trivia: "Noctilucent clouds shine electric blue in the twilight mesosphere at 50 miles altitude, illuminated by sunlight long after sunset." },
      { monsterId: 12, monsterName: "The Flowerpot Lurker", message: "I drank the condensation from the windowsill and left the freshest green sprout for your hair. Rise whenever you wish.", trivia: "The driest non-polar region on Earth is Chile's Atacama Desert; some weather stations there have never recorded rainfall." },
      { monsterId: 13, monsterName: "The Long-Eared Curfew", message: "My ears picked up your heartbeat from across the garden. It is the only tempo in this strange world that makes any sense to me.", trivia: "Snowflakes take approximately an hour to travel from cloud to Earth, drifting lazily at an average speed of 3.1 miles per hour." },
      { monsterId: 14, monsterName: "The Velvet Wyrmling", message: "I am curled tight around your forgotten slippers. If you promise not to move too fast, I will share their warmth.", trivia: "Lightning strikes the Earth approximately 8 million times every single day, or about 100 times every second." },
      { monsterId: 15, monsterName: "The River-Pebble Fawn", message: "The river stones told me your name this morning. The water sings it whenever it slips over smooth granite.", trivia: "Freezing rain occurs when liquid drops pass through a warm air layer aloft and only turn to ice upon striking subfreezing surfaces." },
      { monsterId: 16, monsterName: "The Strawberry Thief", message: "I took one ripe berry from the kitchen counter, but I left a little dewdrop in its place. Good morning, sweetest thief of my attention.", trivia: "Ball lightning is an unexplained atmospheric phenomenon where luminous, spherical objects float horizontally through closed rooms." },
      { monsterId: 17, monsterName: "The Thorn-Winged Quillkin", message: "Do not be startled by my quills; they soften into moss whenever your eyes meet mine. Have a tender morning.", trivia: "A single bolt of cloud-to-ground lightning contains enough thermal energy to toast approximately 100,000 slices of bread." },
      { monsterId: 18, monsterName: "The Porcelain Cloud-Lover", message: "The fog this morning is just my cousins gathering on the lawn. They wanted to know why I refused to leave this house.", trivia: "Virga is rain that evaporates completely in dry air before ever making contact with the Earth's surface." },
      { monsterId: 19, monsterName: "The Scarfed Burrower", message: "I tied my scarf as tight as I could, but the only real warmth in this forest begins when your bedroom shutters creak open.", trivia: "A blizzard must sustain winds of at least 35 miles per hour and reduce visibility to less than a quarter mile for 3 consecutive hours." },
      { monsterId: 20, monsterName: "The Prismatic Snail-Babe", message: "I leave a trail of tiny rainbow prisms on your floorboard. Step over them carefully—they are morning wishes I brought for you.", trivia: "Glory rings, colorful circular rainbows seen around shadows on clouds, are formed by wave tunneling of light through droplets." },
      { monsterId: 21, monsterName: "The Ceramic Cup-Ghost", message: "Good morning. I blew the scald off your coffee so your tongue stays safe. Let the world wait a little longer.", trivia: "The highest temperature ever reliably recorded on Earth was 134°F (56.7°C) at Furnace Creek in Death Valley on July 10, 1913." },
      { monsterId: 22, monsterName: "The Brass-Key Mothling", message: "I held the latch on the front door all night so no draft would disturb your slumber. Your breath is the only breeze I want to feel.", trivia: "Dirty thunderstorms, or volcanic lightning, happen when violent ash collisions generate massive electrostatic charges." },
      { monsterId: 23, monsterName: "The Rain-Lily Pip", message: "The rain started at dawn just to give me an excuse to cling to your porch. Please stay wrapped in your quilt a while.", trivia: "Morning fog is actually a stratus cloud that touched down at ground level due to nocturnal radiative cooling." },
      { monsterId: 24, monsterName: "The Acorn-Shell Hermit", message: "I tapped three times on the oak tree root to summon the dawn. It came, but it has nothing on your sleepy gaze.", trivia: "Graupel, or soft hail, forms when supercooled water droplets collect and freeze on falling snowflakes, creating rime pellets." },
      { monsterId: 25, monsterName: "The Star-Belly Nightling", message: "The sunrise was trying to chase me away into the dark, but I tucked my head into your shadow where it is always safe.", trivia: "Aurora borealis displays occur between 60 and 400 miles above Earth when solar wind particles collide with atmospheric gases." },

      { monsterId: 17, monsterName: "The Thorn-Winged Quillkin", message: "I shed a single golden quill on your rug. It is soft as down; keep it under your pillow when you miss me.", trivia: "The smell of rain in urban areas often carries ozone and hydrocarbons stripped from asphalt surfaces by the sudden downpour." },
      { monsterId: 21, monsterName: "The Ceramic Cup-Ghost", message: "Good morning, my sweet anomaly. Even the morning shadows pause when you awaken. The world is brighter now.", trivia: "A single cumulus cloud can weigh more than 1.1 million pounds, drifting unseen above your dreams on invisible air pillars." },
      { monsterId: 24, monsterName: "The Acorn-Shell Hermit", message: "I knocked on your windowsill three times: once for morning, once for luck, and once because I adore you.", trivia: "Thunder cannot be heard further than about 10 to 15 miles from the lightning strike due to atmospheric sound refraction." },

      { monsterId: 29, monsterName: "The Glass-Jar Dandelion", message: "I spun three times in my jar when your eyes fluttered open. Welcome back to the waking world, my delight.", trivia: "Sun dogs were described by Aristotle in 350 BC, who noted that two mock suns always appeared at the same altitude as the true sun." }
    ];

    const STORAGE_PREFIX = "morning_monster_v1_";
    let currentMonsterId = 0;
    let currentStory = COMBINATIONS[0];
    let activeImage = new Image();
    let imageLoaded = false;

    const offscreenCanvas = document.createElement("canvas");
    const offscreenCtx = offscreenCanvas.getContext("2d");
    let tapStartTime = -1;

    function getTodayIso() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function formatTodayDate() {
      try {
        return new Date().toLocaleDateString("en-US", {
          weekday: "long",
          month: "long",
          day: "numeric"
        }).toUpperCase();
      } catch (e) {
        return "MORNING REVERIE";
      }
    }

    function getHistory(key) {
      try {
        const raw = localStorage.getItem(STORAGE_PREFIX + key) || "";
        return raw ? raw.split(",").map(Number).filter(n => !isNaN(n)) : [];
      } catch (e) {
        return [];
      }
    }

    function recordHistory(key, id, maxLen) {
      try {
        const list = getHistory(key).filter(x => x !== id);
        list.push(id);
        while (list.length > maxLen) list.shift();
        localStorage.setItem(STORAGE_PREFIX + key, list.join(","));
      } catch (e) {}
    }

    function pickUnseenMonsterId(excludeId) {
      const history = getHistory("seenMonsters");
      const recent = history.slice(-10);
      const total = MONSTERS.length;
      const candidates = [];
      const fallback = [];
      for (let i = 0; i < total; i++) {
        if (i !== excludeId) {
          fallback.push(i);
          if (!recent.includes(i)) candidates.push(i);
        }
      }
      const pool = candidates.length > 0 ? candidates : fallback;
      const chosen = pool[Math.floor(Math.random() * pool.length)] ?? ((excludeId + 1) % total);
      recordHistory("seenMonsters", chosen, 20);
      return chosen;
    }

    function pickUnseenStory(monsterId) {
      const seen = getHistory("seenStories");
      const matching = [];
      const anyMatching = [];
      for (let i = 0; i < COMBINATIONS.length; i++) {
        if (COMBINATIONS[i].monsterId === monsterId) {
          anyMatching.push(i);
          if (!seen.includes(i)) matching.push(i);
        }
      }
      const pool = matching.length > 0 ? matching : anyMatching;
      const chosenIdx = pool[Math.floor(Math.random() * pool.length)] ?? 0;
      recordHistory("seenStories", chosenIdx, 80);
      return COMBINATIONS[chosenIdx];
    }

    function hexToRgb(hexStr) {
      const clean = hexStr.replace("#", "");
      const num = parseInt(clean, 16);
      return {
        r: (num >> 16) & 255,
        g: (num >> 8) & 255,
        b: num & 255
      };
    }

    function renderState() {
      const monster = MONSTERS[currentMonsterId] || MONSTERS[0];
      document.getElementById("dateDisplay").textContent = formatTodayDate();
      document.getElementById("monsterName").textContent = currentStory.monsterName || monster.name;
      document.getElementById("speciesTitle").textContent = monster.title;
      document.getElementById("morningMessage").textContent = currentStory.message;
      document.getElementById("weatherTrivia").textContent = currentStory.trivia;

      const rgb = hexToRgb(monster.auraHex);
      const auraEl = document.getElementById("breathingAura");
      auraEl.style.background = `radial-gradient(circle, rgba(${rgb.r},${rgb.g},${rgb.b},0.34) 0%, rgba(${rgb.r},${rgb.g},${rgb.b},0.14) 55%, rgba(${rgb.r},${rgb.g},${rgb.b},0) 100%)`;

      const cardEl = document.getElementById("monsterCard");
      cardEl.style.borderColor = `rgba(${rgb.r},${rgb.g},${rgb.b},0.35)`;

      imageLoaded = false;
      const img = new Image();
      img.onload = () => {
        activeImage = img;
        imageLoaded = true;
        syncCanvasSize();
      };
      img.src = monster.img;
    }

    function loadDailyOrMidnightMonster() {
      const today = getTodayIso();
      try {
        const savedDate = localStorage.getItem(STORAGE_PREFIX + "savedDate");
        const savedMonsterId = parseInt(localStorage.getItem(STORAGE_PREFIX + "lastMonsterId") || "-1", 10);
        const savedStoryJson = localStorage.getItem(STORAGE_PREFIX + "savedStory");

        if (savedDate === today && savedMonsterId >= 0 && savedMonsterId < MONSTERS.length && savedStoryJson) {
          currentMonsterId = savedMonsterId;
          currentStory = JSON.parse(savedStoryJson);
          renderState();
          return;
        }

        const nextId = (savedMonsterId >= 0 && savedMonsterId < MONSTERS.length)
          ? pickUnseenMonsterId(savedMonsterId)
          : 0;
        currentMonsterId = nextId;
        currentStory = pickUnseenStory(nextId);

        localStorage.setItem(STORAGE_PREFIX + "savedDate", today);
        localStorage.setItem(STORAGE_PREFIX + "lastMonsterId", String(nextId));
        localStorage.setItem(STORAGE_PREFIX + "savedStory", JSON.stringify(currentStory));
      } catch (e) {
        currentMonsterId = 0;
        currentStory = COMBINATIONS[0];
      }
      renderState();
    }

    function selectMonster(index) {
      const total = MONSTERS.length;
      currentMonsterId = ((index % total) + total) % total;
      currentStory = pickUnseenStory(currentMonsterId);
      renderState();
    }

    function onMonsterTapped() {
      tapStartTime = performance.now();
      currentStory = pickUnseenStory(currentMonsterId);
      const monster = MONSTERS[currentMonsterId] || MONSTERS[0];
      document.getElementById("monsterName").textContent = currentStory.monsterName || monster.name;
      document.getElementById("morningMessage").textContent = currentStory.message;
      document.getElementById("weatherTrivia").textContent = currentStory.trivia;
    }

    const cardEl = document.getElementById("monsterCard");
    let touchStartX = 0;
    let touchStartY = 0;

    cardEl.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    cardEl.addEventListener("touchend", (e) => {
      if (e.changedTouches.length === 1) {
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.3) {
          if (dx < 0) selectMonster(currentMonsterId + 1);
          else selectMonster(currentMonsterId - 1);
          return;
        }
      }
    }, { passive: true });

    cardEl.addEventListener("click", onMonsterTapped);
    document.getElementById("morningMessage").addEventListener("click", onMonsterTapped);
    document.getElementById("triviaCard").addEventListener("click", onMonsterTapped);

    const canvas = document.getElementById("monsterCanvas");
    const ctx = canvas.getContext("2d");

    function syncCanvasSize() {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.max(1, Math.round(rect.width * dpr));
      const h = Math.max(1, Math.round(rect.height * dpr));
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
      if (imageLoaded && activeImage.width > 0 && activeImage.height > 0) {
        offscreenCanvas.width = w;
        offscreenCanvas.height = h;
        const bw = activeImage.width;
        const bh = activeImage.height;
        const scale = Math.max(w / bw, h / bh);
        const sw = bw * scale;
        const sh = bh * scale;
        const ox = (w - sw) * 0.5;
        const oy = (h - sh) * 0.5;
        offscreenCtx.clearRect(0, 0, w, h);
        offscreenCtx.drawImage(activeImage, ox, oy, sw, sh);
      }
    }

    window.addEventListener("resize", syncCanvasSize);

    function pingPongSine(timeMs, halfCycleMs) {
      const cyclePos = (timeMs % (halfCycleMs * 2)) / halfCycleMs;
      const t = cyclePos <= 1.0 ? cyclePos : (2.0 - cyclePos);
      return 0.5 * (1.0 - Math.cos(Math.PI * t));
    }

    function computeTapScale(now) {
      if (tapStartTime < 0) return 1.0;
      const elapsed = now - tapStartTime;
      if (elapsed > 520) {
        tapStartTime = -1;
        return 1.0;
      }
      if (elapsed < 70) {
        return 1.0 - 0.08 * (elapsed / 70);
      }
      const t = (elapsed - 70) / 450;
      return 1.0 + 0.06 * Math.exp(-4.5 * t) * Math.sin(t * Math.PI * 3.5);
    }

    function animate(now) {
      // 1. Liminal Full-Image Breathing (4600ms half-cycle = 9.2s full cycle)
      const fullPhase = pingPongSine(now, 4600);
      const fullTranslateY = 2.5 - fullPhase * 6.0;
      const tapFactor = computeTapScale(now);
      const fullScaleX = (1.000 + fullPhase * 0.010) * tapFactor;
      const fullScaleY = (1.000 + fullPhase * 0.016) * tapFactor;

      cardEl.style.transform = `translate3d(0px, ${fullTranslateY.toFixed(2)}px, 0px) scale(${fullScaleX.toFixed(4)}, ${fullScaleY.toFixed(4)})`;

      // Displaced Atmospheric Aura behind the frame
      const auraTranslateY = 6.0 - fullPhase * 15.0;
      const auraTranslateX = 4.0 - fullPhase * 8.0;
      const auraScale = 0.970 + fullPhase * 0.065;
      const auraEl = document.getElementById("breathingAura");
      auraEl.style.transform = `translate3d(${auraTranslateX.toFixed(2)}px, ${auraTranslateY.toFixed(2)}px, 0px) scale(${auraScale.toFixed(4)})`;

      // 2. Face-Safe Independent Lower-Torso Chest Breathing (3800ms half-cycle = 7.6s full cycle)
      if (imageLoaded && offscreenCanvas.width > 0 && offscreenCanvas.height > 0) {
        const cw = canvas.width;
        const ch = canvas.height;
        const chestPhase = pingPongSine(now, 3800);
        const breathDelta = chestPhase - 0.35;

        ctx.clearRect(0, 0, cw, ch);
        ctx.drawImage(offscreenCanvas, 0, 0);

        const chestCenterY = 0.70;
        const chestRadiusY = 0.13;
        const startY = Math.floor(0.57 * ch);
        const endY = Math.ceil(0.83 * ch);
        const sliceStep = 2;

        for (let y = startY; y < endY; y += sliceStep) {
          const ny = y / ch;
          const dy = (ny - chestCenterY) / chestRadiusY;
          const dySq = dy * dy;
          if (dySq >= 1.0) continue;

          const ty = 1.0 - dySq;
          const wy = ty * ty * ty;

          const srcY = y + (wy * breathDelta * 0.0095 * ch) - ((ny - chestCenterY) * wy * breathDelta * 0.055 * ch);
          const scaleX = 1.0 + wy * breathDelta * 0.026;
          const destW = cw * scaleX;
          const destX = (cw - destW) * 0.5;

          ctx.drawImage(
            offscreenCanvas,
            0, srcY, cw, sliceStep,
            destX, y, destW, sliceStep
          );
        }
      }

      requestAnimationFrame(animate);
    }

    loadDailyOrMidnightMonster();
    setInterval(() => {
      const savedDate = localStorage.getItem(STORAGE_PREFIX + "savedDate");
      if (savedDate !== getTodayIso()) {
        loadDailyOrMidnightMonster();
      }
    }, 15000);

    requestAnimationFrame(animate);
  </script>
</body>
</html>
